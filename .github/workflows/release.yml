name: Release Node Binary

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev libssl-dev libudev-dev llvm protobuf-compiler

      - name: Install Rust toolchain
        run: rustup show

      - name: Build node
        run: cargo build --release -p selendra-node

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/release/selendra-node dist/selendra-node-x86_64-linux
          sha256sum dist/selendra-node-x86_64-linux > dist/selendra-node-x86_64-linux.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/selendra-node-x86_64-linux
            dist/selendra-node-x86_64-linux.sha256
