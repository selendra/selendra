[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./out" }]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 15

[rpc_endpoints]
selendra_testnet = "https://rpc-testnet.selendra.org"
selendra_mainnet = "https://rpc.selendra.org"

[etherscan]
selendra_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://rpc-testnet.selendra.org/api" }
selendra_mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://rpc.selendra.org/api" }
